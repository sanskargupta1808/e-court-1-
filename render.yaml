services:
  - type: web
    name: ecourt-api
    runtime: python
    rootDir: ecourt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        fromDatabase:
          name: ecourt-db
          property: connectionString

databases:
  - name: ecourt-db
    databaseName: ecourt
